# Training recipe for the example scene `my_scene` (recommended recipe = Custom-05 default: freeze100 + scaleL2x100).
# scene_name must match the scene config configs/legacy/SMPLX_dataloader/CUSTOM/<scene_name>.yaml.
# For another scene, copy this file to Custom-<scene_name>.yaml and change scene_name / save_root_override.
# Run: bash scripts/usage/01_train_custom.sh configs/datasets/Custom-my_scene.yaml <gpu>
# Other base recipes: extends: ../default2.yaml, ../default2_loose.yaml (loose clothing) or ../default3.yaml
extends: ./Custom-05-v14_optim_v6_freeze100_scaleL2x100.yaml
scene_name: 'my_scene'                       # = CUSTOM/<scene_name>.yaml file name
data_path: /path/to/my_scene_training        # for reference only (actual data path is training_folder in the scene yaml)
save_root_override: outputs/my_scene/default
